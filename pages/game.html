<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Madrugando</title>

    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/header.css">
    <link rel="stylesheet" href="../Styles/game.css">
    <link rel="stylesheet" href="../Styles/hud.css">
    <link rel="stylesheet" href="../Styles/menu.css">

</head>


<body>

    <header class="game-header">

        <h1 class="game-title">
            Madrugando
        </h1>


        <nav class="game-navigation">

            <a
                href="../index.html"
                class="back-button">

                ⬅ Voltar

            </a>

        </nav>

    </header>


    <main class="game-container">


        <canvas
            id="gameCanvas"
            class="game-canvas"
            width="1280"
            height="720">

            Seu navegador não suporta Canvas.

        </canvas>


        <div id="game-menu">

            <div class="menu-content">

                <img
                src="../assets/images/logo.png"
                alt="Madrugando"
                class="game-logo"
        >


                <button id="play-button">
                    Jogar
                </button>


                <button id="customize-button">
                    Customizar Jogo
                </button>


                <button id="how-to-play-button">
                    Como Jogar
                </button>

            </div>

        </div>


        <div id="hud">

            <div class="hud-box">

                <span id="lives">
                    ❤️❤️❤️
                </span>

            </div>


            <div id="wave-progress">

                <div id="wave-number">
                    WAVE 1
                </div>


                <div id="progress-bar">

                    <div id="progress-fill"></div>

                </div>


                <div id="progress-text">
                    0 / 15
                </div>

            </div>


            <div class="hud-box">

                🏆
                <span id="score">
                    0
                </span>

            </div>

        </div>

    </main>


    <script
        type="module"
        src="../scripts/main.js">
    </script>


</body>

</html>
